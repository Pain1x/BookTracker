services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: Books
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin1
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: always
    environment:
      LT_LOAD_ONLY: en,uk
      LT_DISABLE_WEB_UI: true
    ports:
      - "5000:5000"

  blazorwebapp:
    build:
      context: .
      dockerfile: /BlazorWebApp/Dockerfile
    depends_on:
      - db
      - libretranslate
    environment:
      ConnectionStrings__BooksConnection: Host=db;Port=5432;Database=Books;Username=postgres;Password=admin1;IncludeErrorDetail=true
      Translation__Provider: libretranslate
      Translation__LibreTranslate__Endpoint: http://libretranslate:5000
      Translation__LibreTranslate__ApiKey: ""
      Hangfire__Dashboard__Username: admin
      Hangfire__Dashboard__Password: change-me
    ports:
      - "5001:8080"

volumes:
  pgdata: